<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Only Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      z-index: 10;
    }
    #score {
      font-size: 32px;
      font-weight: bold;
      color: #00ff00;
      margin-bottom: 10px;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 20;
    }
    #gameOver h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #ff6600;
    }
    #gameOver p {
      font-size: 24px;
      margin-bottom: 20px;
    }
    #gameOver button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background: #00ff00;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="instructions">Click on cubes to merge!</div>
  </div>
  <div id="gameOver">
    <h1>Game Over!</h1>
    <p id="finalScore">Final Score: 0</p>
    <button onclick="location.reload()">Play Again</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
